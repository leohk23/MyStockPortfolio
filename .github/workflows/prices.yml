name: Refresh prices

on:
  schedule:
    # Every 15 min on weekdays (UTC). Your holdings span Tokyo/Korea (opens 00:00 UTC),
    # Hong Kong, London/Europe, and US (+ after-hours to ~00:00) — so on any weekday a market
    # is live almost continuously 00:00–21:00 UTC. Weekends every exchange is shut (IBIT/GBTC
    # are US ETFs, not spot crypto), so Mon–Fri only; weekend runs would just re-fetch unchanged
    # prices. GitHub cron is best-effort and may lag under load, so 15 min is approximate.
    #
    # NOT `*/15`, which fires on the hour. GitHub's own docs: "The schedule event can be delayed
    # during periods of high loads of GitHub Actions workflow runs. High load times include the
    # start of every hour. If the load is sufficiently high enough, some queued jobs may be
    # dropped." — and then, explicitly, "To decrease the chance of delay, schedule your workflow
    # to run at a different time of the hour."
    #
    # `*/15` did exactly the wrong thing: a quarter of its firings landed on minute 0, the one
    # minute GitHub names as worst. Measured over 990 prices commits between 28 Jul (when */15
    # replaced the original hourly '17 * * * *') and 4 Sep 2026, the schedule fired about SEVEN
    # times a day, and not once within 20 minutes of the previous run. The original author had
    # this right with minute 17; the change to */15 discarded it.
    #
    # Same 15-minute spacing, shifted 3 minutes off every quarter so none of the four lands on
    # the hour. Hours capped at 0-21 because that is the window the comment above describes —
    # 22:00-23:00 UTC has no market open anywhere in this book.
    #
    # This is one change on purpose, so its effect is measurable against the run history above.
    # Nothing else in this file moved.
    - cron: '3,18,33,48 0-21 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Start from what is on origin RIGHT NOW, not from the SHA that triggered this run.
      #
      # actions/checkout pins to `github.sha`, and that goes stale while we fetch 109 tickers.
      # Worked example, 4 Sep 2026: a pot push at 12:07:18 triggered a run pinned to 47b8414; the
      # run spent three minutes fetching; a different run pushed be4042d ("prices: 12:10Z") at
      # 12:10:19; our run then committed its own regeneration on top of the stale 47b8414 and the
      # rebase had to reconcile two independent WHOLESALE rewrites of the same four derived JSON
      # files. Every line differs, so it cannot succeed — CONFLICT in all four, and about a
      # quarter of all runs died this way.
      #
      # Resetting first makes that impossible rather than handled: the base is always current, so
      # there is never a second version to merge with.
      - name: Start from current origin
        run: |
          git fetch --quiet origin main
          git reset --hard --quiet FETCH_HEAD

      # No devDependencies in CI: these two scripts are dependency-free by design.
      # extract-portfolio.js needs the workbook and never runs here.
      - run: node fetch-prices.js --selftest
      - run: node portfolio.js --selftest
      - run: node fetch-prices.js

      # earnings.json is the stored annual-EPS history: refreshed by fetch-prices only when it
      # ages out (weekly), not hourly — so most runs leave it untouched and it drops out here.
      - name: Commit prices.json + history.json + earnings.json + intraday.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json history.json earnings.json intraday.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "prices: $(date -u +%Y-%m-%dT%H:%MZ)"
          # No rebase. These four files are 100% derived, so on any divergence the right answer is
          # to discard ours and refetch — never to reconcile two full regenerations line by line.
          # If origin moved while we were fetching, the push is simply rejected and the next run
          # regenerates from the newer base. Losing that race is not a failure and must not be
          # reported as one: `git pull --rebase --autostash` reporting it as a merge conflict is
          # what made a quarter of runs look broken.
          git push --quiet || echo "push lost the race with a concurrent run - the next run refetches from the new origin"

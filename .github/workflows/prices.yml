name: Refresh prices

on:
  schedule:
    # Hourly. Cron is UTC; this spans the US, HK, and European sessions.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No devDependencies in CI: these two scripts are dependency-free by design.
      # extract-portfolio.js needs the workbook and never runs here.
      - run: node fetch-prices.js --selftest
      - run: node portfolio.js --selftest
      - run: node fetch-prices.js

      # earnings.json is the stored annual-EPS history: refreshed by fetch-prices only when it
      # ages out (weekly), not hourly — so most runs leave it untouched and it drops out here.
      - name: Commit prices.json + history.json + earnings.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json history.json earnings.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "prices: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

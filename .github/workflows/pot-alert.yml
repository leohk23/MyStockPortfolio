name: Pot alerts

# Emails for the pot, each a GitHub issue assigned to the owner that GitHub mails, so no mail
# credential exists anywhere. pot/sell-alert.js: a Review that calls for a sale (D114).
# pot/proposal-alert.js: a new proposal, the whole of it, once its cycle has stamped it (D119). It
# runs on a push that changes a Review or a proposal, which is how the laptop's arrive, and is called
# by pot-review.yml after the cloud Review pushes, because a push made with a workflow's own token
# starts no other workflow.

on:
  push:
    branches: [main]
    paths: ['pot/reviews/*.md', 'pot/proposals/*.md']
  workflow_call:
  workflow_dispatch:
    inputs:
      test:
        description: 'Open one test issue, to check the email reaches the inbox: a sale, or the newest proposal.'
        type: choice
        options: [none, sale, proposal]
        default: none

permissions:
  contents: read
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    concurrency:
      group: pot-alert
      cancel-in-progress: false
    steps:
      # main, not the commit that started the run: called after pot-review.yml's push, the run's own
      # commit predates the Review it is meant to read.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A test runs only the step it names. On a push or a call, `inputs.test` is empty and both run.
      - name: Sale
        if: inputs.test != 'proposal'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST: ${{ inputs.test == 'sale' && '--test' || '' }}
        run: node pot/sell-alert.js $TEST
      - name: Proposal
        if: inputs.test != 'sale'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST: ${{ inputs.test == 'proposal' && '--test' || '' }}
        run: node pot/proposal-alert.js $TEST

name: Pot second-run Sweep

# The Mon/Wed/Fri second run's Sweep, on Claude with Leo's subscription, run here so it happens with
# the laptop shut (D111). This file decides when; pot-lane.yml runs the lane and pushes it.
#
# The laptop's `MyStockPortfolio pot second run` at 12:45 stays as the fallback. Its -SweepGapHours 3
# (D108) skips the Sweep once this one has landed, and run-daily.ps1 waits for a run of this
# workflow that is still going (Wait-CloudLanes).

on:
  # Started by cron-job.org, as prices.yml is, with no `schedule:` here (D118). GitHub's own cron
  # runs here hours late or not at all, and a firing at 17:00 would find the laptop's 12:45 Sweep
  # over three hours old and sweep a second time. The job POSTs this workflow's dispatches endpoint
  # with `{"ref":"main"}`, on the price job's token, at crontab `17 11,12 * * 1,3,5` in UTC.
  #
  # Mon, Wed, Fri. UTC has no DST, so 11:17 UTC is 11:17 in winter and 12:17 in summer, ahead of the
  # laptop's 12:45 either way. The 12:17 UTC call is a retry for one that does not arrive; the gate
  # makes it a no-op when the first one swept.
  workflow_dispatch:
    inputs:
      mode:
        description: 'run: as scheduled, gated. force: skip the 3-hour gate. check: sign in and answer one line, no lane.'
        type: choice
        options: [run, force, check]
        default: run

permissions:
  contents: read

concurrency:
  group: pot-sweep
  cancel-in-progress: false

jobs:
  # D108's gap, as the laptop's second run applies it: no Sweep when the newest one, by its file's
  # UTC stamp, is under three hours old.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
    env:
      MODE: ${{ github.event.inputs.mode || 'run' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gate
        id: gate
        shell: pwsh
        run: |
          $go = $true
          if ($env:MODE -eq 'run') {
            $last = Get-ChildItem pot/sweeps -Filter '*.md' | Where-Object { $_.BaseName -match '^\d{4}-\d{2}-\d{2}-\d{4}$' } |
              ForEach-Object { [datetime]::ParseExact($_.BaseName, 'yyyy-MM-dd-HHmm', [Globalization.CultureInfo]::InvariantCulture,
                [Globalization.DateTimeStyles]'AssumeUniversal, AdjustToUniversal') } |
              Sort-Object -Descending | Select-Object -First 1
            if ($last) {
              $age = ((Get-Date).ToUniversalTime() - $last).TotalHours
              if ($age -lt 3) { $go = $false; 'The newest Sweep is {0:N1} h old, under 3 (D108): nothing to do.' -f $age }
            }
          }
          Add-Content $env:GITHUB_OUTPUT "go=$($go.ToString().ToLower())"

  sweep:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/pot-lane.yml
    with:
      lane: sweep
      mode: ${{ github.event.inputs.mode == 'check' && 'check' || 'run' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

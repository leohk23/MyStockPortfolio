<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stock Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .table-responsive { width: 100%; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; min-width: 900px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        th { background-color: #f2f2f2; }
        .gain { color: green; }
        .loss { color: red; }
        #summary { margin-top: 20px; font-weight: bold; }
        #updated { color: #666; font-size: 13px; margin-bottom: 10px; }
        th:first-child, td:first-child { text-align: left; }
        tbody tr:nth-child(even) { background-color: #fafafa; }
        @media (max-width: 600px) {
            body { margin: 5px; }
            table { font-size: 12px; min-width: 600px; }
            th, td { padding: 4px; }
        }
    </style>
</head>
<body>
    <h1>My Stock Portfolio (Values in USD)</h1>
    <div id="updated">Loading…</div>
    <div class="table-responsive">
    <table id="portfolio-table">
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Quantity</th>
                <th>Purchase Price</th>
                <th>Current Price</th>
                <th>Value</th>
                <th>Gain/Loss ($)</th>
                <th>Gain/Loss (%)</th>
                <th>7d %</th>
                <th>1m %</th>
                <th>3m %</th>
                <th>6m %</th>
                <th>1y %</th>
                <th>YTD %</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </div>
    <div id="summary"></div>

    <script src="data.js"></script>
    <script>
        const usd = n => '$' + Math.round(n).toLocaleString();
        const pct = n => n == null ? '-' : `${n}%`;
        const cls = n => n == null ? '' : n >= 0 ? 'gain' : 'loss';

        // Purchase prices are recorded in the currency data.js declares; 'Gbpence' is GBP/100.
        function purchasePriceUSD(stock, rates) {
            const inGBP = stock.currency === 'Gbpence';
            const rate = inGBP ? rates.GBP / 100 : rates[stock.currency];
            return stock.purchasePrice * rate;
        }

        function displayPortfolio({ updated, rates, quotes }) {
            const tableBody = document.querySelector('#portfolio-table tbody');
            let totalPurchaseValueUSD = 0;
            let totalCurrentValueUSD = 0;

            const rows = [];
            for (const stock of portfolio) {
                const quote = quotes[stock.yhoo || stock.symbol];
                if (!quote) continue;

                const purchaseUSD = purchasePriceUSD(stock, rates);
                const purchaseValueUSD = stock.quantity * purchaseUSD;
                const currentValueUSD = stock.quantity * quote.priceUSD;
                const gainLossUSD = currentValueUSD - purchaseValueUSD;
                const gainLossPercent = purchaseValueUSD ? (gainLossUSD / purchaseValueUSD) * 100 : 0;

                totalPurchaseValueUSD += purchaseValueUSD;
                totalCurrentValueUSD += currentValueUSD;
                rows.push({ stock, quote, purchaseUSD, currentValueUSD, gainLossUSD, gainLossPercent });
            }

            rows.sort((a, b) => b.currentValueUSD - a.currentValueUSD);

            for (const r of rows) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${r.stock.symbol}</td>
                    <td>${r.stock.quantity}</td>
                    <td>$${r.purchaseUSD.toFixed(2)}</td>
                    <td>$${r.quote.priceUSD.toFixed(2)}</td>
                    <td>${usd(r.currentValueUSD)}</td>
                    <td class="${cls(r.gainLossUSD)}">${usd(r.gainLossUSD)}</td>
                    <td class="${cls(r.gainLossPercent)}">${Math.round(r.gainLossPercent)}%</td>
                    <td class="${cls(r.quote['7d'])}">${pct(r.quote['7d'])}</td>
                    <td class="${cls(r.quote['1m'])}">${pct(r.quote['1m'])}</td>
                    <td class="${cls(r.quote['3m'])}">${pct(r.quote['3m'])}</td>
                    <td class="${cls(r.quote['6m'])}">${pct(r.quote['6m'])}</td>
                    <td class="${cls(r.quote['1y'])}">${pct(r.quote['1y'])}</td>
                    <td class="${cls(r.quote.ytd)}">${pct(r.quote.ytd)}</td>
                `;
                tableBody.appendChild(row);
            }

            const totalGainLossUSD = totalCurrentValueUSD - totalPurchaseValueUSD;
            const totalGainLossPercent = totalPurchaseValueUSD ? (totalGainLossUSD / totalPurchaseValueUSD) * 100 : 0;

            document.getElementById('summary').innerHTML = `
                Total Portfolio Value: ${usd(totalCurrentValueUSD)}<br>
                <span class="${cls(totalGainLossUSD)}">Total Gain/Loss: ${usd(totalGainLossUSD)} (${Math.round(totalGainLossPercent)}%)</span>
            `;
            document.getElementById('updated').textContent =
                `Prices as of ${new Date(updated).toLocaleString()}`;
        }

        fetch('prices.json?t=' + Date.now())
            .then(r => r.ok ? r.json() : Promise.reject(new Error(`prices.json: HTTP ${r.status}`)))
            .then(displayPortfolio)
            .catch(err => {
                document.getElementById('updated').textContent = `Could not load prices: ${err.message}`;
                console.error(err);
            });
    </script>
</body>
</html>

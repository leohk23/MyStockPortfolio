<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stock Portfolio</title>
    <style>
        /* Dark only — the page does not follow the OS theme. */
        :root {
            color-scheme: dark;
            --surface-1: #1a1a19;
            --surface-2: #232427;
            --surface-3: #1c1d20;
            --line: #303236;
            --text-primary: #ffffff;
            --text-secondary: #c3c2b7;
            --text-muted: #85847c;
            --series-1: #3987e5;   /* validated on #1a1a19: lightness band, chroma floor, 3:1 contrast */
            --good: #4ec26f;
            --bad: #ef5f5f;
        }
        body {
            font-family: -apple-system, "Segoe UI", Arial, sans-serif;
            margin: 16px; background: var(--surface-1); color: var(--text-primary);
        }
        h1 { font-size: 20px; margin: 0 0 2px; }
        #updated { color: var(--text-muted); font-size: 12px; margin-bottom: 14px; }

        #totals { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 18px; }
        #totals > div { min-width: 110px; }
        #totals .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
        #totals .value { font-size: 20px; font-weight: 600; }

        .btns { display: flex; gap: 4px; }
        .btns button {
            font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer;
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--line); border-radius: 5px;
        }
        .btns button:hover { border-color: var(--text-muted); }
        .btns button[aria-pressed="true"] { background: var(--series-1); border-color: var(--series-1); color: #fff; }

        /* ---- NAV chart ---- */
        #chart-card { background: var(--surface-3); border: 1px solid var(--line); border-radius: 8px; padding: 14px 14px 8px; margin-bottom: 24px; }
        #chart-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
        #chart-title { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
        #chart-change { font-size: 18px; font-weight: 600; margin: 2px 0; }
        #chart-sub { font-size: 12px; color: var(--text-muted); }
        #ranges { margin-left: auto; }
        #plot { position: relative; }
        #plot svg { display: block; width: 100%; }
        .grid { stroke: var(--line); stroke-width: 1; }
        .axis-label { fill: var(--text-muted); font-size: 10px; }
        .navline { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
        .navarea { fill: var(--series-1); opacity: .10; }
        .crosshair { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; }
        .cursor-dot { fill: var(--series-1); stroke: var(--surface-3); stroke-width: 2; } /* 2px surface ring */
        #tip {
            position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
            background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
            padding: 6px 8px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -100%);
        }
        #tip .d { color: var(--text-muted); font-size: 11px; }
        #chart-note { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        /* ---- tables ---- */
        .table-responsive { width: 100%; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; min-width: 1080px; }
        th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: right; white-space: nowrap; }
        th { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; }
        th:first-child, td:first-child { text-align: left; }
        .gain { color: var(--good); }
        .loss { color: var(--bad); }
        .muted { color: var(--text-muted); }

        th[data-sort] { cursor: pointer; user-select: none; }
        th[data-sort]:hover { color: var(--text-primary); }
        th[data-sort]::after { content: ''; opacity: .45; margin-left: 4px; }
        th[aria-sort="descending"]::after { content: '▼'; }
        th[aria-sort="ascending"]::after { content: '▲'; }

        /* Group rows expand to show the instruments behind them. */
        tr.group { cursor: pointer; }
        tr.group:hover { background: var(--surface-2); }
        tr.group td:first-child::before { content: '▸ '; color: var(--text-muted); }
        tr.group.open td:first-child::before { content: '▾ '; }
        tr.group.single td:first-child::before { content: '   '; }
        tr.leg { display: none; font-size: 12px; background: var(--surface-3); }
        tr.leg.show { display: table-row; }
        tr.leg td:first-child { padding-left: 26px; color: var(--text-secondary); }

        h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 26px 0 6px; }
        #geo table { min-width: 420px; }

        @media (max-width: 600px) {
            body { margin: 8px; }
            table { font-size: 12px; }
            th, td { padding: 5px 6px; }
            #ranges { margin-left: 0; width: 100%; }
            #ranges button { flex: 1; padding: 6px 0; } /* thumb-sized hit targets */
        }
    </style>
</head>
<body>
    <h1>My Stock Portfolio</h1>
    <div id="updated">Loading…</div>

    <div id="totals"></div>

    <section id="chart-card">
        <div id="chart-head">
            <div>
                <div id="chart-title">Portfolio value</div>
                <div id="chart-change">–</div>
                <div id="chart-sub">–</div>
            </div>
            <div id="ranges" class="btns" role="group" aria-label="Chart range">
                <button data-days="21" aria-pressed="false">1M</button>
                <button data-days="63" aria-pressed="false">3M</button>
                <button data-days="126" aria-pressed="false">6M</button>
                <button data-days="0" aria-pressed="true">12M</button>
            </div>
        </div>
        <div id="plot">
            <svg id="nav" role="img" aria-label="Portfolio value over time"></svg>
            <div id="tip" role="status"></div>
        </div>
        <div id="chart-note">Today's holdings valued at past prices — trades and FX moves are not replayed.</div>
    </section>

    <div class="table-responsive">
        <table id="portfolio">
            <thead>
                <tr>
                    <th data-sort="name">Position</th>
                    <th data-sort="tradeDate">Last trade</th>
                    <th data-sort="since">Since</th>
                    <th data-sort="cost">Cost</th>
                    <th data-sort="value" aria-sort="descending">Value</th>
                    <th data-sort="gain">Gain/Loss</th>
                    <th data-sort="gainPct">%</th>
                    <th data-sort="value">Mix</th>
                    <th data-sort="yield">Yield</th>
                    <th data-sort="7d">7D</th>
                    <th data-sort="1m">1M</th>
                    <th data-sort="3m">3M</th>
                    <th data-sort="6m">6M</th>
                    <th data-sort="1y">1Y</th>
                    <th data-sort="ytd">YTD</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="geo">
        <h2>By geography</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr><th>Region</th><th>Cost</th><th>Value</th><th>Gain/Loss</th><th>%</th><th>Mix</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="portfolio.js"></script>
    <script>
        // Everything is computed in USD; display currency is a presentation-layer divide.
        // rates.GBP is "USD per 1 GBP", so a GBP figure is usd / rates.GBP.
        const CURRENCIES = { USD: '$', GBP: '£', HKD: 'HK$' };
        let display = CURRENCIES[localStorage.getItem('ccy')] ? localStorage.getItem('ccy') : 'USD';
        let RATES = { USD: 1 };

        const money = usd => {
            const v = usd / RATES[display];
            return (v < 0 ? '-' : '') + CURRENCIES[display] + Math.round(Math.abs(v)).toLocaleString();
        };
        const pct = n => n == null ? '–' : `${n >= 0 ? '+' : '−'}${Math.abs(n * 100).toFixed(1)}%`;
        const plain = n => n == null ? '–' : `${(n * 100).toFixed(1)}%`;
        const cls = n => n == null ? 'muted' : n >= 0 ? 'gain' : 'loss';
        const shortDate = iso => new Date(iso + 'T00:00:00Z')
            .toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: '2-digit', timeZone: 'UTC' });

        let STATE = null;              // { rows, geo, nav, total }
        let sort = { key: 'value', dir: -1 };
        let rangeDays = 0;             // 0 = the whole series

        /* ---------------- NAV chart ---------------- */
        function drawChart() {
            const svg = document.getElementById('nav');
            const tip = document.getElementById('tip');
            const n = STATE.nav.values.length;
            const from = rangeDays > 0 ? Math.max(0, n - rangeDays) : 0;
            const days = STATE.nav.days.slice(from);
            const values = STATE.nav.values.slice(from);

            const W = svg.clientWidth || svg.parentNode.clientWidth;
            const H = 200, L = 62, R = 12, T = 10, B = 22;
            if (!W || values.length < 2) return;

            const first = values[0], last = values[values.length - 1];
            const change = (last - first) / first;
            document.getElementById('chart-change').innerHTML =
                `<span class="${cls(change)}">${pct(change)}</span> <span class="muted">${money(last - first)}</span>`;
            document.getElementById('chart-sub').textContent =
                `${money(last)} · ${shortDate(days[0])} → ${shortDate(days[days.length - 1])}`;

            // Pad the domain so the line never touches the frame.
            let lo = Math.min(...values), hi = Math.max(...values);
            const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.02 || 1;
            lo -= pad; hi += pad;

            const x = i => L + (i / (values.length - 1)) * (W - L - R);
            const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

            const ticks = 4;
            const gridEls = Array.from({ length: ticks + 1 }, (_, k) => lo + (k / ticks) * (hi - lo)).map(v =>
                `<line class="grid" x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}"/>` +
                `<text class="axis-label" x="${L - 8}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${money(v)}</text>`
            ).join('');

            // First / middle / last date — enough to orient, not enough to clutter.
            const dateEls = [0, Math.floor((days.length - 1) / 2), days.length - 1].map((i, k) =>
                `<text class="axis-label" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${shortDate(days[i])}</text>`
            ).join('');

            const line = values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
            const area = `${line} L${x(values.length - 1).toFixed(1)},${y(lo).toFixed(1)} L${x(0).toFixed(1)},${y(lo).toFixed(1)} Z`;

            svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
            svg.setAttribute('height', H);
            svg.innerHTML = `
                ${gridEls}${dateEls}
                <path class="navarea" d="${area}"/>
                <path class="navline" d="${line}"/>
                <line class="crosshair" id="cross" y1="${T}" y2="${H - B}" style="display:none"/>
                <circle class="cursor-dot" id="dot" r="4" style="display:none"/>
                <rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;

            const cross = svg.querySelector('#cross'), dot = svg.querySelector('#dot');
            const move = ev => {
                const rect = svg.getBoundingClientRect();
                const scale = W / rect.width; // svg units per css pixel
                const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left) * scale;
                const step = (W - L - R) / (values.length - 1);
                const i = Math.max(0, Math.min(values.length - 1, Math.round((px - L) / step)));
                const cx = x(i), cy = y(values[i]);
                cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.style.display = '';
                dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.style.display = '';
                const delta = (values[i] - first) / first;
                tip.innerHTML = `<div class="d">${shortDate(days[i])}</div>${money(values[i])} <span class="${cls(delta)}">${pct(delta)}</span>`;
                tip.style.left = `${cx / scale}px`;
                tip.style.top = `${cy / scale - 10}px`;
                tip.style.opacity = 1;
            };
            const leave = () => { tip.style.opacity = 0; cross.style.display = 'none'; dot.style.display = 'none'; };
            const hit = svg.querySelector('#hit');
            hit.addEventListener('mousemove', move);
            hit.addEventListener('mouseleave', leave);
            hit.addEventListener('touchmove', ev => { ev.preventDefault(); move(ev); }, { passive: false });
            hit.addEventListener('touchend', leave);
        }

        /* ---------------- tables ---------------- */
        function tradeCell(t) {
            if (!t) return '<span class="muted">–</span>';
            const price = t.price.toLocaleString(undefined, { maximumFractionDigits: 2 });
            const side = t.side === 'SELL' ? 'SELL' : 'BUY';
            return `<span class="${side === 'BUY' ? 'gain' : 'loss'}">${side}</span> ${shortDate(t.date)} <span class="muted">@ ${price}</span>`;
        }

        // Sort keys map onto row fields; the period columns live under row.moves.
        const sortValue = (row, key) => {
            if (portfolioLib.PERIODS.includes(key)) return row.moves[key];
            if (key === 'tradeDate') return row.lastTrade ? row.lastTrade.date : '';
            return row[key];
        };

        function sortedRows() {
            const rows = [...STATE.rows];
            rows.sort((a, b) => {
                const x = sortValue(a, sort.key), y = sortValue(b, sort.key);
                // Nulls always sink, regardless of direction.
                if (x == null && y == null) return 0;
                if (x == null) return 1;
                if (y == null) return -1;
                if (typeof x === 'string') return sort.dir * x.localeCompare(y);
                return sort.dir * (x - y);
            });
            return rows;
        }

        function renderTotals() {
            const cost = STATE.rows.reduce((a, r) => a + r.cost, 0);
            const value = STATE.total;
            const gain = value - cost;
            document.getElementById('totals').innerHTML = `
                <div><div class="label">Value</div><div class="value">${money(value)}</div></div>
                <div><div class="label">Cost</div><div class="value">${money(cost)}</div></div>
                <div><div class="label">Gain/Loss</div><div class="value ${cls(gain)}">${money(gain)}</div></div>
                <div><div class="label">Return</div><div class="value ${cls(gain)}">${pct(gain / cost)}</div></div>
                <div><div class="label">Positions</div><div class="value">${STATE.rows.length}</div></div>
                <div>
                    <div class="label">Currency</div>
                    <div class="btns" style="margin-top:3px">
                        ${Object.keys(CURRENCIES).map(c =>
                            `<button data-ccy="${c}" aria-pressed="${c === display}">${c}</button>`).join('')}
                    </div>
                </div>`;
            document.querySelectorAll('[data-ccy]').forEach(b =>
                b.addEventListener('click', () => {
                    display = b.dataset.ccy;
                    localStorage.setItem('ccy', display);
                    renderAll();
                }));
        }

        function renderPortfolio() {
            const total = STATE.total;
            const tbody = document.querySelector('#portfolio tbody');
            tbody.innerHTML = '';
            for (const r of sortedRows()) {
                const tr = document.createElement('tr');
                tr.className = 'group' + (r.legs.length > 1 ? '' : ' single');
                tr.innerHTML = `
                    <td>${r.name}${r.legs.length > 1 ? ` <span class="muted">(${r.legs.length})</span>` : ''}</td>
                    <td>${tradeCell(r.lastTrade)}</td>
                    <td class="${cls(r.since)}">${pct(r.since)}</td>
                    <td>${money(r.cost)}</td>
                    <td>${money(r.value)}</td>
                    <td class="${cls(r.gain)}">${money(r.gain)}</td>
                    <td class="${cls(r.gainPct)}">${pct(r.gainPct)}</td>
                    <td>${plain(r.value / total)}</td>
                    <td class="muted">${r.yield ? plain(r.yield) : '–'}</td>
                    ${portfolioLib.PERIODS.map(p => `<td class="${cls(r.moves[p])}">${pct(r.moves[p])}</td>`).join('')}`;
                tbody.appendChild(tr);

                const legRows = r.legs.map(leg => {
                    const el = document.createElement('tr');
                    el.className = 'leg';
                    const gain = leg.value - leg.cost;
                    el.innerHTML = `
                        <td>${leg.yahoo} <span class="muted">${leg.qty} @ ${leg.quote.price.toLocaleString()} ${leg.quote.currency}</span></td>
                        <td>${tradeCell(leg.lastTrade)}</td>
                        <td class="${cls(leg.since)}">${pct(leg.since)}</td>
                        <td>${money(leg.cost)}</td>
                        <td>${money(leg.value)}</td>
                        <td class="${cls(gain)}">${money(gain)}</td>
                        <td class="${cls(gain)}">${pct(leg.cost ? gain / leg.cost : null)}</td>
                        <td>${plain(leg.value / total)}</td>
                        <td></td>
                        ${portfolioLib.PERIODS.map(p => `<td class="${cls(leg.quote[p])}">${pct(leg.quote[p])}</td>`).join('')}`;
                    tbody.appendChild(el);
                    return el;
                });

                if (r.legs.length > 1) {
                    tr.addEventListener('click', () => {
                        tr.classList.toggle('open');
                        legRows.forEach(l => l.classList.toggle('show'));
                    });
                }
            }
        }

        function renderGeography() {
            const tbody = document.querySelector('#geo tbody');
            tbody.innerHTML = '';
            for (const r of STATE.geo) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.name}</td>
                    <td>${money(r.cost)}</td>
                    <td>${money(r.value)}</td>
                    <td class="${cls(r.gain)}">${money(r.gain)}</td>
                    <td class="${cls(r.gain)}">${pct(r.cost ? r.gain / r.cost : null)}</td>
                    <td>${plain(r.value / STATE.total)}</td>`;
                tbody.appendChild(tr);
            }
        }

        function renderAll() {
            renderTotals();
            renderPortfolio();
            renderGeography();
            drawChart();
        }

        document.querySelectorAll('#ranges button').forEach(b =>
            b.addEventListener('click', () => {
                rangeDays = Number(b.dataset.days);
                document.querySelectorAll('#ranges button').forEach(o =>
                    o.setAttribute('aria-pressed', String(o === b)));
                drawChart();
            }));

        document.querySelectorAll('#portfolio th[data-sort]').forEach(th =>
            th.addEventListener('click', () => {
                const key = th.dataset.sort;
                // Same column toggles direction; a new column starts descending,
                // except the name column, which reads better A→Z.
                sort = sort.key === key
                    ? { key, dir: -sort.dir }
                    : { key, dir: key === 'name' ? 1 : -1 };
                document.querySelectorAll('#portfolio th[data-sort]').forEach(o => o.removeAttribute('aria-sort'));
                th.setAttribute('aria-sort', sort.dir === 1 ? 'ascending' : 'descending');
                renderPortfolio();
            }));

        const bust = '?t=' + Date.now();
        Promise.all([
            fetch('holdings.json' + bust).then(r => r.json()),
            fetch('prices.json' + bust).then(r => r.json()),
        ]).then(([{ holdings }, { updated, rates, quotes, nav }]) => {
            RATES = rates;
            const rows = portfolioLib.build(holdings, rates, quotes);
            STATE = {
                rows, nav,
                geo: portfolioLib.byGeography(holdings, rates, quotes),
                total: rows.reduce((a, r) => a + r.value, 0),
            };
            renderAll();
            document.getElementById('updated').textContent =
                `Prices as of ${new Date(updated).toLocaleString()} · tap a grouped row to see its instruments`;
            new ResizeObserver(drawChart).observe(document.getElementById('plot'));
        }).catch(err => {
            document.getElementById('updated').textContent = `Could not load data: ${err.message}`;
            console.error(err);
        });
    </script>
</body>
</html>

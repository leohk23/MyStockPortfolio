<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stock Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .table-responsive { width: 100%; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; min-width: 900px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        th { background-color: #f2f2f2; }
        .gain { color: green; }
        .loss { color: red; }
        #summary { margin-top: 20px; font-weight: bold; }
        @media (max-width: 600px) {
            body { margin: 5px; }
            table { font-size: 12px; min-width: 600px; }
            th, td { padding: 4px; }
        }
    </style>
</head>
<body>
    <h1>My Stock Portfolio (Values in USD)</h1>
    <div class="table-responsive">
    <table id="portfolio-table">
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Quantity</th>
                <th>Purchase Price</th>
                <th>Current Price</th>
                <th>Value</th>
                <th>Gain/Loss ($)</th>
                <th>Gain/Loss (%)</th>
                <th>7d %</th>
                <th>1m %</th>
                <th>3m %</th>
                <th>6m %</th>
                <th>1y %</th>
                <th>YTD %</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </div>
    <div id="summary"></div>

    <script src="data.js"></script>
    <script>
        async function getCurrentPrice(yhoo) {
            try {
                const response = await fetch(`/api/${yhoo}`);
                const data = await response.json();
                let price = data.chart.result[0].meta.regularMarketPrice;
                if (yhoo === 'SPOL.L') {
                    price /= 100;
                }
                return price;
            } catch (error) {
                return null;
            }
        }

        async function getHistoricalPrice(yhoo, period) {
            try {
                const response = await fetch(`/api/${yhoo}?period=${period}`);
                const data = await response.json();
                // Use the last value in the close array for the start-of-period price
                let closes = data.chart.result[0].indicators.quote[0].close;
                let price = closes && closes.length > 0 ? closes[closes.length - 1] : null;
                if (yhoo === 'SPOL.L' && price !== null) {
                    price /= 100;
                }
                return price;
            } catch (error) {
                return null;
            }
        }

        async function getExchangeRate(currency) {
            if (currency === 'USD') return 1;
            try {
                const response = await fetch(`/api/${currency}USD=X`);
                const data = await response.json();
                return data.chart.result[0].meta.regularMarketPrice;
            } catch (error) {
                return null;
            }
        }

        async function displayPortfolio() {
            const tableBody = document.querySelector('#portfolio-table tbody');
            let totalPurchaseValueUSD = 0;
            let totalCurrentValueUSD = 0;

            const currencyMap = portfolio.map(stock => stock.currency === 'Gbpence' ? 'GBP' : stock.currency);
            const currencies = [...new Set(currencyMap)];
            const rates = {};
            for (const c of currencies) {
                rates[c] = await getExchangeRate(c);
                if (rates[c] === null) rates[c] = 1;
            }

            for (const stock of portfolio) {
                let effectiveCurrency = stock.currency;
                let effectivePurchasePrice = stock.purchasePrice;
                if (stock.currency === 'Gbpence') {
                    effectiveCurrency = 'GBP';
                    effectivePurchasePrice /= 100;
                }

                const yhoo = stock.yhoo || stock.symbol;
                let currentPriceLC = await getCurrentPrice(yhoo);
                if (currentPriceLC === null) continue;

                // Fetch historical prices for price movement columns
                const periods = [
                    { key: '7d', period: '7d' },
                    { key: '1m', period: '1mo' },
                    { key: '3m', period: '3mo' },
                    { key: '6m', period: '6mo' },
                    { key: '1y', period: '1y' },
                    { key: 'ytd', period: 'ytd' }
                ];
                let movements = {};
                for (const p of periods) {
                    let histPrice = await getHistoricalPrice(yhoo, p.period);
                    if (histPrice && histPrice > 0) {
                        movements[p.key] = Math.round(((currentPriceLC - histPrice) / histPrice) * 100);
                    } else {
                        movements[p.key] = '-';
                    }
                }

                const purchasePriceUSD = effectivePurchasePrice * rates[effectiveCurrency];
                const currentPriceUSD = currentPriceLC * rates[effectiveCurrency];
                const purchaseValueUSD = stock.quantity * purchasePriceUSD;
                const currentValueUSD = stock.quantity * currentPriceUSD;
                const gainLossUSD = currentValueUSD - purchaseValueUSD;
                const gainLossPercent = purchaseValueUSD ? (gainLossUSD / purchaseValueUSD) * 100 : 0;

                totalPurchaseValueUSD += purchaseValueUSD;
                totalCurrentValueUSD += currentValueUSD;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${stock.symbol}</td>
                    <td>${stock.quantity}</td>
                    <td>$${purchasePriceUSD.toFixed(2)}</td>
                    <td>$${currentPriceUSD.toFixed(2)}</td>
                    <td>$${Math.round(currentValueUSD).toLocaleString()}</td>
                    <td class="${gainLossUSD >= 0 ? 'gain' : 'loss'}">$${Math.round(gainLossUSD).toLocaleString()}</td>
                    <td class="${gainLossPercent >= 0 ? 'gain' : 'loss'}">${Math.round(gainLossPercent)}%</td>
                    <td>${movements['7d'] !== '-' ? movements['7d'] + '%' : '-'}</td>
                    <td>${movements['1m'] !== '-' ? movements['1m'] + '%' : '-'}</td>
                    <td>${movements['3m'] !== '-' ? movements['3m'] + '%' : '-'}</td>
                    <td>${movements['6m'] !== '-' ? movements['6m'] + '%' : '-'}</td>
                    <td>${movements['1y'] !== '-' ? movements['1y'] + '%' : '-'}</td>
                    <td>${movements['ytd'] !== '-' ? movements['ytd'] + '%' : '-'}</td>
                `;
                tableBody.appendChild(row);
            }

            const totalGainLossUSD = totalCurrentValueUSD - totalPurchaseValueUSD;
            const totalGainLossPercent = totalPurchaseValueUSD ? (totalGainLossUSD / totalPurchaseValueUSD) * 100 : 0;

            document.getElementById('summary').innerHTML = `
                Total Portfolio Value: $${Math.round(totalCurrentValueUSD).toLocaleString()}<br>
                Total Gain/Loss: $${Math.round(totalGainLossUSD).toLocaleString()} (${Math.round(totalGainLossPercent)}%)
            `;
        }

        displayPortfolio().catch(err => console.error('Portfolio display failed:', err));
    </script>
</body>
</html>
